name: Sossoldi Flutter CI

on:
  pull_request:
  push:

env:
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

concurrency:
  group: ${{ github.head_ref != '' && github.head_ref || github.ref  }}
  cancel-in-progress: true

jobs:
  format-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action/config@v3
        id: fvm-config-action

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Check versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: |
          echo "Checking code formatting (default line length 80)..."
          if ! dart format --set-exit-if-changed --output=none .; then
            echo "⛔ ERROR: Code format check failed. Please run 'dart format .' on your code and commit the formatted changes."
            exit 1
          else
            echo "✅ Code format check passed."
          fi

      - name: Run tests
        run: flutter test --concurrency=1

      - name: Prepare Android signing
        if: github.event_name == 'push'
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]; then
            : "${ANDROID_KEYSTORE_BASE64:?Incomplete Android signing configuration}"
            : "${ANDROID_KEYSTORE_PASSWORD:?Incomplete Android signing configuration}"
            : "${ANDROID_KEY_ALIAS:?Incomplete Android signing configuration}"
            : "${ANDROID_KEY_PASSWORD:?Incomplete Android signing configuration}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          else
            keytool -genkeypair \
              -keystore android/app/keystore.jks \
              -storetype JKS \
              -storepass ci-password \
              -alias ci \
              -keypass ci-password \
              -keyalg RSA \
              -dname "CN=Sossoldi CI" \
              -validity 1
            ANDROID_KEYSTORE_PASSWORD=ci-password
            ANDROID_KEY_ALIAS=ci
            ANDROID_KEY_PASSWORD=ci-password
          fi

          cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build APK and App Bundle
        if: github.event_name == 'push'
        run: |
          flutter build appbundle --flavor default

      - name: Verify release Internet permission
        if: github.event_name == 'push'
        run: |
          manifest="$(find build/app/intermediates/merged_manifests -name AndroidManifest.xml -print -quit)"
          test -n "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
